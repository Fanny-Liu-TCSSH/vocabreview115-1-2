<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>段考單字衝刺營｜L4 - L6 課本 + All in One</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Nunito & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            dopamine: {
              bg: '#FFFDF7',
              dark: '#1E293B',
              yellow: '#FFE66D',
              mint: '#4ECDC4',
              pink: '#FF6B6B',
              purple: '#845EC2',
              blue: '#3B82F6',
            }
          },
          boxShadow: {
            'pop-sm': '2px 2px 0px #1E293B',
            'pop': '4px 4px 0px #1E293B',
            'pop-lg': '6px 6px 0px #1E293B',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FFFDF7;
      background-image: radial-gradient(#CBD5E1 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .btn-pop {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-pop:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1E293B;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-dopamine-dark min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b-4 border-dopamine-dark px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-dopamine-yellow border-2 border-dopamine-dark shadow-pop-sm flex items-center justify-center text-xl">
          ⚡
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black leading-tight">段考單字衝刺營</h1>
          <p class="text-xs font-bold text-slate-500">L4 - L6 課本 + All in One</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 錯題本按鈕 -->
        <button type="button" id="btn-mistake-drawer" class="btn-pop bg-dopamine-pink text-white font-black text-xs sm:text-sm px-3 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm flex items-center gap-1.5">
          <i class="fa-solid fa-book-skull"></i>
          <span>錯題本</span>
          <span id="mistake-count-badge" class="bg-dopamine-yellow text-dopamine-dark text-xs font-black px-1.5 py-0.5 rounded-full border border-dopamine-dark">0</span>
        </button>

        <!-- 登入 / GAS 同步狀態按鈕 -->
        <button type="button" id="btn-user-profile" class="btn-pop bg-dopamine-blue text-white font-black text-xs sm:text-sm px-3 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm flex items-center gap-1.5">
          <i id="sync-status-icon" class="fa-regular fa-user"></i>
          <span id="user-status-text">未登入</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 w-full max-w-xl mx-auto px-4 py-5 flex flex-col gap-4">

    <!-- 1. 課次篩選與出題模式切換列 (可橫向滑動，手機單手好按) -->
    <section aria-label="篩選課次與模式" class="flex flex-col gap-2.5">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1" id="filter-bar">
        <button type="button" data-filter="ALL" class="filter-chip btn-pop shrink-0 bg-dopamine-yellow text-dopamine-dark font-black text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm">
          🎲 全部隨機 (161)
        </button>
        <button type="button" data-filter="L4" class="filter-chip btn-pop shrink-0 bg-white text-dopamine-dark font-bold text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm hover:bg-slate-50">
          Lesson 4 (60)
        </button>
        <button type="button" data-filter="L5" class="filter-chip btn-pop shrink-0 bg-white text-dopamine-dark font-bold text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm hover:bg-slate-50">
          Lesson 5 (53)
        </button>
        <button type="button" data-filter="L6" class="filter-chip btn-pop shrink-0 bg-white text-dopamine-dark font-bold text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm hover:bg-slate-50">
          Lesson 6 (48)
        </button>
        <button type="button" data-filter="MISTAKE" class="filter-chip btn-pop shrink-0 bg-purple-100 text-dopamine-dark font-extrabold text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm">
          🔥 專攻錯題 (<span id="chip-mistake-count">0</span>)
        </button>
      </div>

      <!-- 進度條與答對率統計 -->
      <div class="bg-white rounded-2xl border-2 border-dopamine-dark p-3 shadow-pop-sm flex items-center justify-between gap-3">
        <div class="flex-1">
          <div class="flex justify-between text-xs sm:text-sm font-extrabold mb-1">
            <span>本輪進度：<span id="progress-current" class="text-dopamine-blue">1</span> / <span id="progress-total">161</span> 題</span>
            <span class="text-emerald-600">連續答對 🔥 <span id="streak-count">0</span></span>
          </div>
          <div class="w-full h-3 bg-slate-100 rounded-full border border-dopamine-dark overflow-hidden">
            <div id="progress-bar" class="h-full bg-dopamine-mint rounded-full transition-all duration-300" style="width: 1%;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 核心答題卡片 (大字體、高對比、手機打字友善) -->
    <section aria-label="單字測驗卡片" class="bg-white rounded-3xl border-4 border-dopamine-dark shadow-pop-lg p-5 sm:p-7 flex flex-col gap-5 relative">
      
      <!-- 卡片頂部：出處標籤 & 兩段式獨立救命提示按鈕 -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span id="source-badge" class="inline-flex items-center gap-1.5 bg-dopamine-purple text-white text-xs sm:text-sm font-extrabold px-3.5 py-1.5 rounded-xl border-2 border-dopamine-dark">
          <i class="fa-solid fa-bookmark"></i>
          <span id="source-badge-text">L4 課本單字例句</span>
        </span>

        <!-- 兩個獨立救命按鈕：按了才顯示提示 -->
        <div class="flex items-center gap-2">
          <button type="button" id="btn-hint-collocation" class="btn-pop bg-dopamine-yellow text-dopamine-dark font-black text-xs sm:text-sm px-3 py-2 rounded-xl border-2 border-dopamine-dark shadow-pop-sm flex items-center gap-1.5">
            <i class="fa-solid fa-lightbulb text-amber-700"></i>
            <span>1. 搭配詞提示</span>
          </button>
          <button type="button" id="btn-hint-meaning" class="btn-pop bg-orange-200 text-dopamine-dark font-black text-xs sm:text-sm px-3 py-2 rounded-xl border-2 border-dopamine-dark shadow-pop-sm flex items-center gap-1.5">
            <i class="fa-solid fa-language text-rose-600"></i>
            <span>2. 單字中文</span>
          </button>
        </div>
      </div>

      <!-- 題目英文句子區 (字體放大至 20px-24px，行距寬鬆) -->
      <div class="bg-amber-50/70 rounded-2xl border-2 border-dashed border-amber-300 p-4 sm:p-5 flex flex-col gap-3">
        <p id="question-text" class="text-xl sm:text-2xl font-bold leading-relaxed tracking-wide text-dopamine-dark"></p>

        <!-- 救命提示 1 顯示區：按了「1. 搭配詞提示」才顯示 (預設 hidden) -->
        <div id="collocation-hint-box" class="hidden pt-2.5 border-t-2 border-amber-200 flex flex-wrap items-center gap-2">
          <span class="bg-dopamine-yellow text-dopamine-dark text-xs font-black px-2.5 py-1 rounded-lg border border-dopamine-dark shrink-0">
            💡 搭配詞線索
          </span>
          <span id="collocation-hint-text" class="bg-yellow-200 px-3 py-1 rounded-xl border-2 border-dopamine-dark text-base sm:text-lg font-black text-dopamine-dark tracking-wide"></span>
        </div>

        <!-- 救命提示 2 顯示區：按了「2. 單字中文」才顯示 (預設 hidden) -->
        <div id="meaning-hint-box" class="hidden pt-2.5 border-t-2 border-amber-200 flex flex-wrap items-center gap-2">
          <span class="bg-dopamine-pink text-white text-xs font-black px-2.5 py-1 rounded-lg border border-dopamine-dark shrink-0">
            🔤 目標單字中文
          </span>
          <span id="meaning-hint-text" class="text-base sm:text-lg font-black text-rose-700"></span>
        </div>
      </div>

      <!-- 手機打字輸入框區 -->
      <div class="flex flex-col gap-2.5">
        <label for="answer-input" class="sr-only">請輸入完整英文單字</label>
        <div class="relative">
          <input 
            type="text" 
            id="answer-input" 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="none" 
            spellcheck="false"
            inputmode="latin"
            placeholder="請輸入完整單字..."
            class="w-full text-2xl sm:text-3xl font-black tracking-wider text-center py-4 px-5 rounded-2xl border-4 border-dopamine-dark bg-slate-50 focus:bg-white focus:outline-none focus:ring-4 focus:ring-dopamine-yellow transition-all"
          >
          <!-- 清除輸入按鈕 -->
          <button type="button" id="btn-clear-input" aria-label="清除輸入" class="absolute right-3.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center font-bold">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- 字母數提示與狀態提示 -->
        <div class="flex justify-between items-center px-1 text-sm font-bold text-slate-500">
          <span id="letter-clue-text"></span>
          <span id="typed-length-indicator" class="text-dopamine-blue">已輸入：0 字</span>
        </div>
      </div>

      <!-- ==================== 作答結果回饋區 (送出答案後才顯示，含整句翻譯) ==================== -->
      <!-- 狀態 A：答對綠色顯示 (預設 hidden) -->
      <div id="feedback-correct" class="hidden rounded-2xl border-4 border-emerald-700 bg-emerald-100 p-4 flex flex-col gap-2.5">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-emerald-500 text-white border-2 border-emerald-800 flex items-center justify-center text-2xl shrink-0">
            <i class="fa-solid fa-check"></i>
          </div>
          <div>
            <p class="text-lg sm:text-xl font-black text-emerald-900">太棒了！拼字完全正確 🎉</p>
            <p class="text-sm font-bold text-emerald-800">正確答案：<span id="correct-ans-display" class="underline text-base font-black"></span></p>
          </div>
        </div>
        <div class="pt-2 border-t-2 border-emerald-300/80 text-sm sm:text-base font-bold text-emerald-950 flex items-start gap-2">
          <span class="bg-emerald-600 text-white text-xs font-black px-2 py-0.5 rounded-md shrink-0 mt-0.5">整句翻譯</span>
          <p id="correct-translation-text"></p>
        </div>
      </div>

      <!-- 狀態 B：答錯紅色顯示 (預設 hidden) -->
      <div id="feedback-wrong" class="hidden rounded-2xl border-4 border-rose-700 bg-rose-100 p-4 flex flex-col gap-2.5">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-rose-500 text-white border-2 border-rose-800 flex items-center justify-center text-2xl shrink-0">
            <i class="fa-solid fa-xmark"></i>
          </div>
          <div>
            <p class="text-lg sm:text-xl font-black text-rose-900">差一點點！已加入錯題本 📌</p>
            <p class="text-sm font-bold text-rose-800">
              你的輸入：<span id="user-wrong-input" class="line-through mr-2"></span> 
              正確：<span id="wrong-correct-ans" class="text-base font-black underline text-rose-950"></span>
            </p>
          </div>
        </div>
        <div class="pt-2 border-t-2 border-rose-300/80 text-sm sm:text-base font-bold text-rose-950 flex items-start gap-2">
          <span class="bg-rose-600 text-white text-xs font-black px-2 py-0.5 rounded-md shrink-0 mt-0.5">整句翻譯</span>
          <p id="wrong-translation-text"></p>
        </div>
      </div>

      <!-- 底部主要操作按鈕列 -->
      <div class="grid grid-cols-3 gap-3 pt-1">
        <button type="button" id="btn-skip" class="btn-pop col-span-1 bg-slate-200 text-dopamine-dark font-extrabold text-base sm:text-lg py-4 rounded-2xl border-2 border-dopamine-dark shadow-pop">
          跳過 ⏭️
        </button>
        <button type="button" id="btn-submit" class="btn-pop col-span-2 bg-dopamine-mint text-dopamine-dark font-black text-lg sm:text-xl py-4 rounded-2xl border-2 border-dopamine-dark shadow-pop flex items-center justify-center gap-2">
          <span id="btn-submit-text">送出答案</span>
          <i id="btn-submit-icon" class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

    </section>
  </main>

  <!-- ==================== 3. 錯題本彈窗 (Mistake Modal) ==================== -->
  <div id="mistake-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-dopamine-bg w-full max-w-lg rounded-3xl border-4 border-dopamine-dark shadow-pop-lg p-5 sm:p-6 flex flex-col gap-4 max-h-[85vh]">
      <div class="flex items-center justify-between border-b-2 border-dopamine-dark pb-3">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📓</span>
          <h2 class="text-xl font-black">我的錯題本 (<span id="mistake-modal-count">0</span>)</h2>
        </div>
        <button type="button" id="btn-close-mistake" class="w-9 h-9 rounded-xl bg-slate-200 hover:bg-slate-300 border-2 border-dopamine-dark font-black flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="mistake-list-container" class="flex-1 overflow-y-auto flex flex-col gap-2.5 pr-1">
        <p class="text-center text-slate-500 font-bold py-8">目前還沒有錯題喔！繼續保持 💪</p>
      </div>

      <div class="pt-2 border-t-2 border-dopamine-dark flex gap-3">
        <button type="button" id="btn-start-mistake-drill" class="btn-pop w-full bg-dopamine-pink text-white font-black text-lg py-3.5 rounded-2xl border-2 border-dopamine-dark shadow-pop">
          🔥 立即特訓所有錯題
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 4. 學生登入與 GAS 同步預留彈窗 ==================== -->
  <div id="login-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl border-4 border-dopamine-dark shadow-pop-lg p-6 flex flex-col gap-4">
      <div class="flex items-center justify-between border-b-2 border-dopamine-dark pb-3">
        <div class="flex items-center gap-2">
          <span class="text-2xl">🚀</span>
          <h2 class="text-xl font-black">學生登入（雲端成績同步）</h2>
        </div>
        <button type="button" id="btn-close-login" class="w-9 h-9 rounded-xl bg-slate-200 hover:bg-slate-300 border-2 border-dopamine-dark font-black flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <p class="text-xs sm:text-sm font-bold text-slate-600 bg-amber-50 p-3 rounded-xl border border-amber-300">
        💡 請輸入你的班級、座號與姓名，系統會自動將你的練習進度與錯題同步給老師！
      </p>

      <div class="flex flex-col gap-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1" for="login-class">班級（如：201）</label>
            <input type="text" id="login-class" inputmode="numeric" placeholder="201" class="w-full px-4 py-3 rounded-xl border-2 border-dopamine-dark font-black text-lg focus:outline-none focus:ring-2 focus:ring-dopamine-yellow">
          </div>
          <div>
            <label class="block text-sm font-black mb-1" for="login-seat">座號（如：05）</label>
            <input type="text" id="login-seat" inputmode="numeric" placeholder="05" class="w-full px-4 py-3 rounded-xl border-2 border-dopamine-dark font-black text-lg focus:outline-none focus:ring-2 focus:ring-dopamine-yellow">
          </div>
        </div>
        <div>
          <label class="block text-sm font-black mb-1" for="login-student-name">姓名</label>
          <input type="text" id="login-student-name" placeholder="請輸入真實姓名" class="w-full px-4 py-3 rounded-xl border-2 border-dopamine-dark font-black text-lg focus:outline-none focus:ring-2 focus:ring-dopamine-yellow">
        </div>
      </div>

      <!-- 登入錯誤提示訊息 -->
      <p id="login-error-msg" class="hidden text-sm font-black text-rose-600 text-center">⚠️ 請完整填寫班級、座號與姓名喔！</p>

      <!-- 本次作答統計快覽 -->
      <div class="bg-slate-100 rounded-2xl p-3 border-2 border-dopamine-dark flex justify-around text-center">
        <div>
          <p class="text-xs font-bold text-slate-500">已練習題數</p>
          <p id="stat-total-answered" class="text-lg font-black text-dopamine-blue">0</p>
        </div>
        <div class="border-l border-slate-300"></div>
        <div>
          <p class="text-xs font-bold text-slate-500">答對題數</p>
          <p id="stat-total-correct" class="text-lg font-black text-emerald-600">0</p>
        </div>
        <div class="border-l border-slate-300"></div>
        <div>
          <p class="text-xs font-bold text-slate-500">雲端同步狀態</p>
          <p id="stat-sync-label" class="text-xs font-black text-slate-700 mt-1">尚未連線</p>
        </div>
      </div>

      <div class="flex gap-2 mt-1">
        <button type="button" id="btn-manual-sync" class="btn-pop flex-1 bg-dopamine-yellow text-dopamine-dark font-black text-base py-3.5 rounded-2xl border-2 border-dopamine-dark shadow-pop">
          ☁️ 立即上傳成績
        </button>
        <button type="button" id="btn-confirm-login" class="btn-pop flex-1 bg-dopamine-blue text-white font-black text-base py-3.5 rounded-2xl border-2 border-dopamine-dark shadow-pop">
          儲存並開始
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 完整 161 題題庫與互動邏輯 ==================== -->
  <script>
    // =========================================================================
    // ★ 請在此處貼上您部署好的 Google Apps Script (GAS) 網頁應用程式網址 ★
    // 範例：const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycb.../exec";
    // =========================================================================
    const GAS_WEB_APP_URL = "請替換為您的_GAS_網頁應用程式網址";

    // L4 - L6 完整 161 題資料 (含句子實際填入字形 ans、原形 word、挖空句子 q、出處 src、搭配詞提示 col、單字中文 mean、整句翻譯 trans)
    const QUESTION_BANK = [
      // ==================== Lesson 4 (60 題) ====================
      { id: 1, lesson: 'L4', word: 'sensitive', ans: 'sensitive', q: 'Kelly is very s_______e to flavors. She can taste any food or drink and name it without seeing it.', src: 'L4 課本單字例句', col: 'be _____ to flavors', mean: '敏感的 (adj.)', trans: 'Kelly 對味道很敏感，不用看就知道吃了或喝了什麼。' },
      { id: 2, lesson: 'L4', word: 'keen', ans: 'keen', q: 'The owl has such a k__n sense of hearing that it can hunt animals in the dark.', src: 'L4 課本單字例句', col: 'a _____ sense of hearing', mean: '敏銳的 (adj.)', trans: '貓頭鷹聽覺非常敏銳，所以可以在黑暗中獵食。' },

      { id: 154, lesson: 'L6', word: 'landmark', ans: 'landmarks', q: "The Tokyo Tower and the Tokyo Skytree are two of Japan's most famous l______ks.", src: 'L6 課本單字例句', col: "two of Japan's most famous _____ (複數)", mean: '地標 (n.)', trans: '東京鐵塔和東京晴空塔是日本最有名地標中的兩個。' },
      { id: 155, lesson: 'L6', word: 'landmark', ans: 'landmark', q: 'The Eiffel Tower was built in 1889. Now, it is a famous l______k in Paris.', src: 'L6 All in One 一、文意字彙', col: 'a famous _____ in Paris', mean: '地標 (n.)', trans: '艾菲爾鐵塔建於 1889 年，現在是巴黎著名的地標。' },
      { id: 156, lesson: 'L6', word: 'globe', ans: 'globe', q: "Many of David Bowie's fans around the g___e posted images or words on Facebook and Instagram in memory of him after he died on January 10, 2016.", src: 'L6 課本單字例句', col: 'around the _____ (全世界)', mean: '地球；世界 (n.)', trans: '大衛鮑伊在 2016 年 1 月 10 日去世後，全世界許多他的粉絲在臉書和 Instagram 上傳圖文紀念他。' },
      { id: 157, lesson: 'L6', word: 'global', ans: 'global', q: 'Many people believe that g____l warming is causing a higher number of large storms such as typhoons.', src: 'L6 課本衍生字例句', col: 'believe that _____ warming is causing...', mean: '全球的；全世界的 (adj.)', trans: '許多人相信全球暖化正造成更多像颱風這樣的大型風暴。' },
      { id: 158, lesson: 'L6', word: 'global', ans: 'global', q: 'The problem of g____l warming is getting worse, and it may threaten our living environment.', src: 'L6 All in One 二、詞類變化', col: 'The problem of _____ warming', mean: '全球的 (adj.)', trans: '全球暖化的問題正日益惡化，且可能威脅我們的生活環境。' },
      { id: 159, lesson: 'L5', word: 'environment', ans: 'environment', q: 'It is everyone’s duty to protect our e_________t from pollution.', src: 'L5 Listening Preview', col: 'protect our _____ from pollution', mean: '自然環境 (n.)', trans: '保護我們的環境免於汙染是每個人的責任。' },
      { id: 160, lesson: 'L5', word: 'plastic', ans: 'plastic', q: 'We should bring our own p_____c bags when shopping.', src: 'L5 Listening Preview', col: 'bring our own _____ bags', mean: '塑膠(製)的 (adj.)', trans: '我們購物時應該自備塑膠袋。' },
      { id: 161, lesson: 'L6', word: 'tourist', ans: 'tourist', q: 'Today, the Statue of Liberty is one of America’s biggest t_____t attractions.', src: 'L6 課文例句', col: 'biggest _____ attractions', mean: '遊客；觀光 (n.)', trans: '今日，自由女神像是美國最大的觀光勝地之一。' }
    ];

    // 狀態管理與學生登入資訊
    let currentFilter = 'ALL';
    let activeDeck = [];
    let currentIndex = 0;
    let streak = 0;
    let totalAnswered = 0;
    let totalCorrect = 0;
    let isChecked = false;
    let mistakes = [];
    let currentQuestionHintUsed = { col: false, mean: false };

    let studentUser = {
      classNum: '',
      seatNum: '',
      name: '',
      isLoggedIn: false
    };

    // DOM 元素
    const answerInput = document.getElementById('answer-input');
    const typedLength = document.getElementById('typed-length-indicator');
    const clearBtn = document.getElementById('btn-clear-input');
    const submitBtn = document.getElementById('btn-submit');
    const submitBtnText = document.getElementById('btn-submit-text');
    const submitBtnIcon = document.getElementById('btn-submit-icon');
    const skipBtn = document.getElementById('btn-skip');
    const feedbackCorrect = document.getElementById('feedback-correct');
    const feedbackWrong = document.getElementById('feedback-wrong');
    const mistakeBadge = document.getElementById('mistake-count-badge');
    const chipMistakeCount = document.getElementById('chip-mistake-count');
    const mistakeModalCount = document.getElementById('mistake-modal-count');
    const mistakeListContainer = document.getElementById('mistake-list-container');

    // 洗牌函數
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 根據篩選條件建立題庫佇列
    function buildDeck(filterType) {
      currentFilter = filterType;
      updateFilterChipStyles();

      if (filterType === 'ALL') {
        activeDeck = shuffleArray(QUESTION_BANK);
      } else if (filterType === 'MISTAKE') {
        activeDeck = mistakes.length === 0 ? [] : shuffleArray(mistakes);
      } else {
        activeDeck = QUESTION_BANK.filter(item => item.lesson === filterType);
      }

      currentIndex = 0;
      renderCurrentQuestion();
    }

    // 更新上方課次按鈕高亮狀態
    function updateFilterChipStyles() {
      document.querySelectorAll('.filter-chip').forEach(btn => {
        const filter = btn.getAttribute('data-filter');
        if (filter === currentFilter) {
          btn.className = 'filter-chip btn-pop shrink-0 bg-dopamine-yellow text-dopamine-dark font-black text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm';
        } else if (filter === 'MISTAKE') {
          btn.className = 'filter-chip btn-pop shrink-0 bg-purple-100 text-dopamine-dark font-extrabold text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm hover:bg-purple-200';
        } else {
          btn.className = 'filter-chip btn-pop shrink-0 bg-white text-dopamine-dark font-bold text-base px-4 py-2 rounded-2xl border-2 border-dopamine-dark shadow-pop-sm hover:bg-slate-50';
        }
      });
    }

    // 將題目中的挖空字串轉為醒目的膠囊標籤
    function formatQuestionHTML(rawSentence) {
      return rawSentence.replace(/([A-Za-z-]+_[A-Za-z_]*)/g, (match) => {
        return `<span class="inline-block bg-white px-2.5 py-0.5 rounded-xl border-2 border-dopamine-dark text-dopamine-blue font-black tracking-widest mx-1">${match}</span>`;
      });
    }

    // 渲染當前題目
    function renderCurrentQuestion() {
      isChecked = false;
      currentQuestionHintUsed = { col: false, mean: false };
      feedbackCorrect.classList.add('hidden');
      feedbackWrong.classList.add('hidden');
      document.getElementById('collocation-hint-box').classList.add('hidden');
      document.getElementById('meaning-hint-box').classList.add('hidden');

      submitBtn.className = 'btn-pop col-span-2 bg-dopamine-mint text-dopamine-dark font-black text-lg sm:text-xl py-4 rounded-2xl border-2 border-dopamine-dark shadow-pop flex items-center justify-center gap-2';
      submitBtnText.textContent = '送出答案';
      submitBtnIcon.className = 'fa-solid fa-paper-plane';

      if (activeDeck.length === 0) {
        document.getElementById('source-badge-text').textContent = '錯題本是空的 🎉';
        document.getElementById('question-text').innerHTML = '目前沒有任何錯題喔！請點選上方「全部隨機」或各課按鈕繼續練習 💪';
        document.getElementById('letter-clue-text').textContent = '';
        document.getElementById('progress-current').textContent = '0';
        document.getElementById('progress-total').textContent = '0';
        document.getElementById('progress-bar').style.width = '0%';
        answerInput.value = '';
        answerInput.disabled = true;
        return;
      }

      answerInput.disabled = false;
      const item = activeDeck[currentIndex];

      document.getElementById('progress-current').textContent = currentIndex + 1;
      document.getElementById('progress-total').textContent = activeDeck.length;
      const pct = Math.max(2, Math.round(((currentIndex + 1) / activeDeck.length) * 100));
      document.getElementById('progress-bar').style.width = `${pct}%`;

      document.getElementById('source-badge-text').textContent = item.src;
      document.getElementById('question-text').innerHTML = formatQuestionHTML(item.q);
      document.getElementById('collocation-hint-text').textContent = item.col;
      document.getElementById('meaning-hint-text').textContent = `${item.mean}`;

      const targetAns = item.ans;
      const firstChar = targetAns[0];
      const lastChar = targetAns[targetAns.length - 1];
      document.getElementById('letter-clue-text').innerHTML =
        `提示：字首 <strong class="text-dopamine-dark">${firstChar}</strong>、字尾 <strong class="text-dopamine-dark">${lastChar}</strong>（共 ${targetAns.length} 個字母）`;

      answerInput.value = '';
      typedLength.textContent = '已輸入：0 字';
      answerInput.focus();
    }

    // 切換至下一題
    function goToNextQuestion() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % activeDeck.length;
      renderCurrentQuestion();
    }

    // 送出答案檢核 或 進入下一題
    function handleSubmitOrNext() {
      if (activeDeck.length === 0) return;

      if (isChecked) {
        goToNextQuestion();
        return;
      }

      const userVal = answerInput.value.trim();
      if (!userVal) {
        answerInput.focus();
        return;
      }

      const item = activeDeck[currentIndex];
      isChecked = true;

      feedbackCorrect.classList.add('hidden');
      feedbackWrong.classList.add('hidden');

      const isCorrect =
        userVal.toLowerCase() === item.ans.toLowerCase() ||
        userVal.toLowerCase() === item.word.toLowerCase();

      totalAnswered += 1;

      if (isCorrect) {
        totalCorrect += 1;
        streak += 1;
        document.getElementById('streak-count').textContent = streak;
        document.getElementById('correct-ans-display').textContent = item.ans;
        document.getElementById('correct-translation-text').textContent = item.trans;
        feedbackCorrect.classList.remove('hidden');

        // 如果在錯題模式答對，可減少錯題計數或保留練習
      } else {
        streak = 0;
        document.getElementById('streak-count').textContent = '0';
        document.getElementById('user-wrong-input').textContent = userVal;
        document.getElementById('wrong-correct-ans').textContent = item.ans;
        document.getElementById('wrong-translation-text').textContent = item.trans;
        feedbackWrong.classList.remove('hidden');

        const existing = mistakes.find(m => m.id === item.id);
        if (existing) {
          existing.count += 1;
        } else {
          mistakes.push({ ...item, count: 1 });
        }
        renderMistakeList();
      }

      updateStatsModalUI();

      // 非同步傳送單題作答紀錄與彙整統計至 Google Apps Script 後台
      sendRecordToGAS({
        action: 'logAnswer',
        classNum: studentUser.classNum,
        seatNum: studentUser.seatNum,
        studentName: studentUser.name,
        questionId: item.id,
        lesson: item.lesson,
        source: item.src,
        targetWord: item.ans,
        userInput: userVal,
        isCorrect: isCorrect,
        usedCollocationHint: currentQuestionHintUsed.col,
        usedMeaningHint: currentQuestionHintUsed.mean,
        totalAnswered: totalAnswered,
        totalCorrect: totalCorrect,
        streak: streak,
        mistakeWords: mistakes.map(m => `${m.ans}(${m.count})`).join(', ')
      });

      submitBtn.className = 'btn-pop col-span-2 bg-dopamine-yellow text-dopamine-dark font-black text-lg sm:text-xl py-4 rounded-2xl border-2 border-dopamine-dark shadow-pop flex items-center justify-center gap-2';
      submitBtnText.textContent = '下一題';
      submitBtnIcon.className = 'fa-solid fa-arrow-right';
    }

    // 更新彈窗內的統計數據
    function updateStatsModalUI() {
      const elAns = document.getElementById('stat-total-answered');
      const elCor = document.getElementById('stat-total-correct');
      if (elAns) elAns.textContent = totalAnswered;
      if (elCor) elCor.textContent = totalCorrect;
    }

    // 傳送資料到 GAS 後台 (使用 text/plain 避免 GitHub Pages 跨域 CORS 預檢失敗)
    async function sendRecordToGAS(payload) {
      const syncIcon = document.getElementById('sync-status-icon');
      const syncLabel = document.getElementById('stat-sync-label');

      if (!studentUser.isLoggedIn) {
        if (syncLabel) syncLabel.textContent = '請先登入以同步';
        return;
      }

      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('請替換')) {
        if (syncLabel) syncLabel.textContent = '尚未設定 GAS 網址';
        return;
      }

      try {
        if (syncIcon) syncIcon.className = 'fa-solid fa-rotate fa-spin';
        if (syncLabel) syncLabel.textContent = '雲端同步中...';

        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        if (syncIcon) syncIcon.className = 'fa-solid fa-cloud-arrow-up text-emerald-200';
        if (syncLabel) syncLabel.textContent = '✅ 已同步至雲端';
      } catch (err) {
        if (syncIcon) syncIcon.className = 'fa-solid fa-triangle-exclamation text-amber-200';
        if (syncLabel) syncLabel.textContent = '⚠️ 同步失敗';
      }
    }

    // 渲染錯題本清單
    function renderMistakeList() {
      if (mistakeBadge) mistakeBadge.textContent = mistakes.length;
      if (chipMistakeCount) chipMistakeCount.textContent = mistakes.length;
      if (mistakeModalCount) mistakeModalCount.textContent = mistakes.length;

      if (!mistakeListContainer) return;

      if (mistakes.length === 0) {
        mistakeListContainer.innerHTML = `<p class="text-center text-slate-500 font-bold py-8">目前還沒有錯題喔！繼續保持 💪</p>`;
        return;
      }

      mistakeListContainer.innerHTML = mistakes.map((item, idx) => `
        <div class="bg-white p-3.5 rounded-2xl border-2 border-dopamine-dark flex items-center justify-between gap-2">
          <div>
            <span class="text-xs font-extrabold text-dopamine-purple">${item.src}</span>
            <p class="text-lg font-black text-dopamine-dark">${item.ans} <span class="text-sm font-bold text-slate-600">${item.mean}</span></p>
            <p class="text-xs font-bold text-slate-500 line-clamp-1">${item.trans}</p>
            <p class="text-xs font-bold text-rose-600 mt-0.5">錯誤次數：${item.count} 次</p>
          </div>
          <button type="button" data-mistake-idx="${idx}" class="btn-practice-single btn-pop shrink-0 bg-dopamine-yellow text-xs font-black px-3 py-2 rounded-xl border-2 border-dopamine-dark">
            單獨重練
          </button>
        </div>
      `).join('');

      document.querySelectorAll('.btn-practice-single').forEach(btn => {
        btn.addEventListener('click', () => {
          const mIdx = parseInt(btn.getAttribute('data-mistake-idx'), 10);
          activeDeck = [...mistakes];
          currentFilter = 'MISTAKE';
          updateFilterChipStyles();
          currentIndex = mIdx;
          document.getElementById('mistake-modal')?.classList.add('hidden');
          renderCurrentQuestion();
        });
      });
    }

    // 安全事件綁定輔助函數
    function safeOn(id, event, handler) {
      const el = document.getElementById(id);
      if (el) el.addEventListener(event, handler);
    }

    answerInput.addEventListener('input', () => {
      typedLength.textContent = `已輸入：${answerInput.value.trim().length} 字`;
    });

    clearBtn.addEventListener('click', () => {
      answerInput.value = '';
      typedLength.textContent = '已輸入：0 字';
      answerInput.focus();
    });

    safeOn('btn-hint-collocation', 'click', () => {
      currentQuestionHintUsed.col = true;
      document.getElementById('collocation-hint-box')?.classList.remove('hidden');
    });

    safeOn('btn-hint-meaning', 'click', () => {
      currentQuestionHintUsed.mean = true;
      document.getElementById('meaning-hint-box')?.classList.remove('hidden');
    });

    submitBtn.addEventListener('click', handleSubmitOrNext);
    skipBtn.addEventListener('click', goToNextQuestion);

    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSubmitOrNext();
      }
    });

    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const filterType = btn.getAttribute('data-filter');
        buildDeck(filterType);
      });
    });

    safeOn('btn-mistake-drawer', 'click', () => {
      document.getElementById('mistake-modal')?.classList.remove('hidden');
    });
    safeOn('btn-close-mistake', 'click', () => {
      document.getElementById('mistake-modal')?.classList.add('hidden');
    });
    safeOn('btn-start-mistake-drill', 'click', () => {
      document.getElementById('mistake-modal')?.classList.add('hidden');
      buildDeck('MISTAKE');
    });
    safeOn('btn-user-profile', 'click', () => {
      document.getElementById('login-modal')?.classList.remove('hidden');
    });
    safeOn('btn-close-login', 'click', () => {
      document.getElementById('login-modal')?.classList.add('hidden');
    });

    // 處理學生登入
    safeOn('btn-confirm-login', 'click', () => {
      const cNum = document.getElementById('login-class')?.value.trim();
      const sNum = document.getElementById('login-seat')?.value.trim();
      const sName = document.getElementById('login-student-name')?.value.trim();
      const errMsg = document.getElementById('login-error-msg');

      if (!cNum || !sNum || !sName) {
        errMsg?.classList.remove('hidden');
        return;
      }

      errMsg?.classList.add('hidden');
      studentUser = {
        classNum: cNum,
        seatNum: sNum.padStart(2, '0'),
        name: sName,
        isLoggedIn: true
      };

      document.getElementById('user-status-text').textContent = `${studentUser.classNum}-${studentUser.seatNum} ${studentUser.name}`;
      document.getElementById('sync-status-icon').className = 'fa-solid fa-circle-check text-emerald-200';
      document.getElementById('login-modal')?.classList.add('hidden');

      // 登入時先發送一筆登入打卡紀錄至 GAS
      sendRecordToGAS({
        action: 'login',
        classNum: studentUser.classNum,
        seatNum: studentUser.seatNum,
        studentName: studentUser.name,
        totalAnswered: totalAnswered,
        totalCorrect: totalCorrect,
        streak: streak,
        mistakeWords: mistakes.map(m => `${m.ans}(${m.count})`).join(', ')
      });

      answerInput.focus();
    });

    // 手動立即上傳成績摘要
    safeOn('btn-manual-sync', 'click', () => {
      const cNum = document.getElementById('login-class')?.value.trim();
      const sNum = document.getElementById('login-seat')?.value.trim();
      const sName = document.getElementById('login-student-name')?.value.trim();
      const errMsg = document.getElementById('login-error-msg');

      if (!cNum || !sNum || !sName) {
        errMsg?.classList.remove('hidden');
        return;
      }

      errMsg?.classList.add('hidden');
      studentUser = {
        classNum: cNum,
        seatNum: sNum.padStart(2, '0'),
        name: sName,
        isLoggedIn: true
      };
      document.getElementById('user-status-text').textContent = `${studentUser.classNum}-${studentUser.seatNum} ${studentUser.name}`;

      sendRecordToGAS({
        action: 'manualSync',
        classNum: studentUser.classNum,
        seatNum: studentUser.seatNum,
        studentName: studentUser.name,
        totalAnswered: totalAnswered,
        totalCorrect: totalCorrect,
        streak: streak,
        mistakeWords: mistakes.map(m => `${m.ans}(${m.count})`).join(', ')
      });
    });

    // 初始化載入全部隨機 161 題，並主動彈出登入視窗引導學生填寫班級座號
    buildDeck('ALL');
    document.getElementById('login-modal')?.classList.remove('hidden');
  </script>
</body>
</html>
